name: build

# Runs checkstyle, tests and the jar build on every push and PR,
# so nobody merges something that doesn't compile.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ChinookAir-jar
          path: target/ChinookAir.jar
