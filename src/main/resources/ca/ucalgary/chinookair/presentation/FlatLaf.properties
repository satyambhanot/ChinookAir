# The ChinookAir theme for the FlatLaf look and feel. The colours are the ones in Palette.java;
# keep the two in step (PaletteTest checks the ones used here).

@accentColor = #066AB0
@foreground = #102A43

# shape
Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
Component.focusWidth = 2
Component.focusColor = #0779C8
Component.borderColor = #D9E2EC
Panel.background = #F5F8FB

# tables
Table.rowHeight = 40
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.intercellSpacing = 0,1
Table.gridColor = #EEF1F4
Table.cellMargins = 4,12,4,12
Table.selectionBackground = #E6F3FC
Table.selectionForeground = #102A43
Table.selectionInactiveBackground = #E6F3FC
Table.selectionInactiveForeground = #102A43
TableHeader.height = 36
TableHeader.background = #EEF3F8
TableHeader.foreground = #52606D
TableHeader.cellMargins = 4,12,4,12
TableHeader.bottomSeparatorColor = #D9E2EC

# buttons: the style names are used through Theme.primary, Theme.danger and so on
[style]Button.primary = \
    background: #066AB0; \
    foreground: #FFFFFF; \
    hoverBackground: #055A96; \
    pressedBackground: #044A7C; \
    focusedBackground: #066AB0; \
    borderWidth: 0; \
    disabledBackground: #EEF2F6; \
    disabledText: #7B8A9C; \
    margin: 6,16,6,16

[style]Button.danger = \
    foreground: #B3261E; \
    borderColor: #E3B5B5; \
    hoverBorderColor: #B3261E; \
    margin: 6,16,6,16

[style]Button.secondary = \
    hoverBackground: #E6F3FC; \
    margin: 6,16,6,16

[style]Button.link = \
    foreground: #066AB0

[style]Button.card = \
    background: #FFFFFF; \
    borderColor: #D9E2EC; \
    hoverBorderColor: #066AB0; \
    hoverBackground: #F5F9FD; \
    pressedBackground: #E6F3FC; \
    focusedBorderColor: #0779C8; \
    arc: 12; \
    borderWidth: 1

[style]Button.day = \
    margin: 0,0,0,0

[style]Button.today = \
    foreground: #066AB0; \
    font: bold

[style]ToggleButton.seat = \
    selectedBackground: #066AB0; \
    selectedForeground: #FFFFFF; \
    borderColor: #C9D3E0; \
    disabledText: #7B8A9C; \
    arc: 8
